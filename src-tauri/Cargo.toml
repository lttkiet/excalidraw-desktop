[package]
name = "excalidraw-desktop"
version = "0.1.0"
description = "An offline desktop drawing app"
authors = ["Excalidraw Desktop"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "excalidraw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
